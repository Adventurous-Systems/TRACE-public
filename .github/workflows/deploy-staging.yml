name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from public staging
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate requested staging release
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Check out complete staging history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false

      - name: Require an exact commit from staging
        shell: bash
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$DEPLOY_SHA^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/staging

  deploy:
    name: Run private blue-green staging wrapper
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://trace-staging.adventurous.systems
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}

    steps:
      # The host wrapper owns private paths, A/B port selection, migrations,
      # candidate verification, the nginx switch, and automatic rollback. It
      # must never modify /opt/TRACE-staging or its data-service Compose project.
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.TRACE_STAGING_SSH_HOST }}
          username: ${{ secrets.TRACE_STAGING_SSH_USER }}
          key: ${{ secrets.TRACE_STAGING_SSH_KEY }}
          fingerprint: ${{ secrets.TRACE_STAGING_SSH_FINGERPRINT }}
          envs: DEPLOY_SHA
          script_stop: true
          script: sudo --non-interactive /usr/local/sbin/trace-deploy-staging "$DEPLOY_SHA"

      - name: Verify public staging after the switch
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 5 \
            https://trace-staging.adventurous.systems/ >/dev/null
          curl --fail --show-error --silent --retry 6 --retry-delay 5 \
            https://trace-staging.adventurous.systems/api/v1/marketplace/listings >/dev/null
