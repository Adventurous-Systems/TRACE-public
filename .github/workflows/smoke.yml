name: Smoke (public demo)

# Runs the read-only @smoke checks against the live domain on a daily schedule or
# a manual dispatch. Creates no data — safe against demo.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-public-demo
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || vars.TRACE_DEMO_LIVE == 'true'
    name: Public read-only smoke
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://demo.trace.adventurous.systems
      E2E_API_URL: https://demo.trace.adventurous.systems

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @trace/e2e exec playwright install --with-deps chromium

      # The deploy that triggers this run restarts the API container; wait until
      # both web and API are actually serving before probing (avoids a false fail).
      # Refuse to touch demo at all if the read-only invariant is broken.
      - name: Assert @smoke isolation
        run: pnpm --filter @trace/e2e check:smoke-isolation

      - name: Wait for demo to be serving
        run: |
          for i in $(seq 1 30); do
            web=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/")
            api=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_API_URL/api/v1/marketplace/listings")
            echo "attempt $i: web=$web api=$api"
            [ "$web" = "200" ] && [ "$api" = "200" ] && exit 0
            sleep 5
          done
          echo "demo did not become ready in time" >&2
          exit 1

      - name: Run smoke checks against demo
        run: pnpm e2e:smoke

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7
