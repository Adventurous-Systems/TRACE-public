name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    name: Exact-SHA source release tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test source release tooling
        run: |
          bash -n ops/release/*.sh
          bash ops/release/test-release-tooling.sh
          bash ops/deploy/test-deployment-state.sh

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://trace:trace@localhost:5432/trace_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-min-16-chars-long
      JWT_EXPIRY: 1h
      API_PORT: 3001
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3001
      NODE_ENV: test
      DEMO_PLATFORM_ADMIN_PASSWORD: UnitTestPlatformOnly!
      DEMO_HUB_ADMIN_PASSWORD: UnitTestAdminOnly!
      DEMO_HUB_STAFF_PASSWORD: UnitTestStaffOnly!
      DEMO_INSPECTOR_PASSWORD: UnitTestInspectorOnly!
      DEMO_BUYER_PASSWORD: UnitTestBuyerOnly!
      DEMO_SUPPLIER_PASSWORD: ci-only-supplier-password
      DEMO_SUPPLIER2_PASSWORD: ci-only-supplier-two-password
      DEMO_APPLICANT_PASSWORD: ci-only-applicant-password

    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16.15-alpine3.24
        env:
          POSTGRES_DB: trace_test
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trace -d trace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # 7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ~2s, no services needed. smoke.yml points the @smoke selection at LIVE
      # production, so that selection must stay strictly read-only.
      - name: Assert @smoke isolation
        run: pnpm --filter @trace/e2e check:smoke-isolation

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build monorepo
        run: pnpm build

      - name: Run database migrations for tests
        run: pnpm --filter @trace/db migrate

      - name: Seed test database
        run: pnpm --filter @trace/db seed

      - name: Run all unit and contract tests
        run: pnpm test

  container-build:
    name: Build and start deployment images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the public repository boundary
        run: node scripts/check-public-boundary.mjs

      - name: Validate Compose definitions
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          install -m 600 /dev/null /tmp/trace-api.env
          install -m 600 /dev/null /tmp/trace-web.env
          printf '%s\n' 'TRACE_DEPLOYMENT_PROFILE=public_showcase' 'NODE_ENV=production' > /tmp/trace-web.env
          docker compose config --quiet
          TRACE_API_ENV_FILE=/tmp/trace-api.env TRACE_WEB_ENV_FILE=/tmp/trace-web.env \
            docker compose --env-file deploy/candidate.env.example \
            -f deploy/compose.app.yml config --quiet
          docker compose --env-file deploy/demo-data.env.example \
            -f deploy/compose.demo-data.yml config --quiet

      - name: Build API and web images
        run: COMPOSE_PROJECT_NAME=trace-ci docker compose build api web

      - name: Build operations image
        run: docker build --file Dockerfile.ops --tag trace-ops:ci .

      - name: Scan release images for all high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output /tmp/trivy.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_checksums.txt \
            --output /tmp/trivy-checksums.txt
          (
            cd /tmp
            grep ' trivy_0.74.0_Linux-64bit.tar.gz$' trivy-checksums.txt \
              | sed 's/trivy_0.74.0_Linux-64bit.tar.gz/trivy.tar.gz/' \
              | sha256sum --check --strict
            tar -xzf trivy.tar.gz trivy
          )
          status=0
          for service in api web; do
            image="trace-ci-$service:latest"
            docker image inspect "$image" >/dev/null
            /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL \
              --exit-code 1 --no-progress --format json \
              --output "/tmp/trivy-$service.json" "$image" || status=1
            /tmp/trivy image --format cyclonedx --output "/tmp/trivy-$service.cdx.json" "$image"
          done
          /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress --format json \
            --output /tmp/trivy-ops.json trace-ops:ci || status=1
          /tmp/trivy image --format cyclonedx --output /tmp/trivy-ops.cdx.json trace-ops:ci
          exit "$status"

      - name: Upload image vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-vulnerability-reports
          path: |
            /tmp/trivy-*.json
            /tmp/trivy-*.cdx.json
          retention-days: 30

      - name: Start isolated data services and migrate
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_PROJECT_NAME=trace-ci docker compose up -d --wait --wait-timeout 120 \
            postgres redis minio thor-solo
          docker run --rm --network trace-ci_default --env-file .env \
            -e DATABASE_URL=postgresql://trace:trace@postgres:5432/trace \
            -e REDIS_URL=redis://redis:6379 \
            -e VECHAIN_NODE_URL=http://thor-solo:8669 \
            -e MINIO_ENDPOINT=minio -e MINIO_PORT=9000 \
            trace-ops:ci dist/scripts/migrate.js

      - name: Start built API and web images in public-showcase mode
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_PROJECT_NAME=trace-ci TRACE_DEPLOYMENT_PROFILE=public_showcase \
            docker compose up -d --no-build api web gateway
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3003/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:3003/api/v1/marketplace/listings >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          COMPOSE_PROJECT_NAME=trace-ci docker compose logs api web gateway
          exit 1

      - name: Verify runtime imports, web secret isolation, and read-only enforcement
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE_PROJECT_NAME=trace-ci docker compose exec -T api node -e \
            "Promise.all([import('@trace/core'),import('@trace/db')]).then(()=>console.log('runtime imports ok'))"
          web_id="$(COMPOSE_PROJECT_NAME=trace-ci docker compose ps -q web)"
          if docker inspect "$web_id" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Eq '^(DATABASE_URL|JWT_SECRET|DEPLOYER_PRIVATE_KEY|WALLET_ENCRYPTION_KEY|MINIO_SECRET_KEY)='; then
            echo 'API secret detected in web container environment' >&2
            exit 1
          fi
          status="$(curl --silent --output /tmp/read-only-response --write-out '%{http_code}' \
            --request POST http://127.0.0.1:3003/api/v1/auth/register \
            --header 'content-type: application/json' \
            --data '{"name":"Blocked","email":"blocked@example.com","password":"blocked-password"}')"
          test "$status" = 403
          grep -q 'READ_ONLY_DEPLOYMENT' /tmp/read-only-response
          docker run --rm --entrypoint node trace-ops:ci -e \
            "import('@trace/core').then(()=>console.log('operations runtime import ok'))"

      - name: Dump container logs on failure
        if: failure()
        run: COMPOSE_PROJECT_NAME=trace-ci docker compose logs --tail 150

      - name: Remove disposable containers and volumes
        if: always()
        run: COMPOSE_PROJECT_NAME=trace-ci docker compose down --volumes --remove-orphans
