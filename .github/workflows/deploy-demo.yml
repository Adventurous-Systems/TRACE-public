name: Deploy public demo

# Runs on every push to main. Waits for CI and Security to both report
# success for that exact commit before invoking the deploy wrapper on the
# demo host; if either fails, the deploy step never runs. `push` (rather than
# `workflow_run`, which zizmor's dangerous-triggers audit flags regardless of
# what a job actually does) keeps this workflow's trigger itself
# unremarkable; the actual gate is the explicit wait below, and the actual
# privilege boundary is the zero-argument sudoers grant on the host (see
# ops/deploy/deploy-main.sh and docs/operations/deployment.md "Automated
# deployment").
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-public-demo
  # A deployment in progress must never be cancelled mid-switch.
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to demo.trace.adventurous.systems
    # A self-hosted runner is the point of this workflow: it is what lets the
    # sudoers-gated deploy wrapper run on the demo host at all. It is scoped
    # to only this repository, runs no PR-triggered or untrusted-input jobs,
    # never checks out repository code, and its account holds no privilege
    # beyond the single zero-argument root command documented above.
    runs-on: [self-hosted, linux, trace-demo-vps] # zizmor: ignore[self-hosted-runner]
    steps:
      - name: Resolve the commit under test
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            sha="$(git ls-remote --exit-code --refs \
              https://github.com/Adventurous-Systems/TRACE-public.git refs/heads/main \
              | cut -f1)"
          else
            sha="$PUSH_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve a commit SHA" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for CI and Security to pass for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          wait_for() {
            local workflow="$1" elapsed=0 interval=30 timeout=1800 conclusion
            while (( elapsed < timeout )); do
              conclusion="$(gh api --method GET "repos/$REPO/actions/workflows/$workflow/runs" \
                -f head_sha="$SHA" --jq '.workflow_runs[0].conclusion // "pending"')"
              case "$conclusion" in
                success) echo "$workflow passed for $SHA"; return 0 ;;
                pending) : ;;
                *)
                  echo "$workflow did not succeed for $SHA (conclusion: $conclusion)" >&2
                  return 1
                  ;;
              esac
              sleep "$interval"
              elapsed=$((elapsed + interval))
            done
            echo "Timed out waiting for $workflow to complete for $SHA" >&2
            return 1
          }
          wait_for ci.yml
          wait_for security.yml

      # No actions/checkout: this job never runs repository code on the demo
      # host. deploy-main.sh independently re-resolves the exact current
      # public main tip and fetches it fresh; it takes no arguments, which is
      # exactly what the host's sudoers grant allows it to be run with.
      - name: Deploy the current public main tip
        run: |
          set -euo pipefail
          sudo -n /usr/local/libexec/trace-demo/deploy-main.sh | tee -a "$GITHUB_STEP_SUMMARY"
