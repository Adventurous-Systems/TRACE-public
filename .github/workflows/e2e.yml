name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16.15-alpine3.24
        env:
          POSTGRES_DB: trace_test
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trace -d trace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # 7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trace:trace@localhost:5432/trace_test
      REDIS_URL: redis://localhost:6379
      # Stored files are plain files; with no nginx here, the API serves them.
      STORAGE_DIR: /tmp/trace-e2e-objects
      STORAGE_SERVE: 'true'
      STORAGE_PUBLIC_URL: http://localhost:3001/minio
      JWT_SECRET: test-secret-min-16-chars-long
      JWT_EXPIRY: 1h
      NODE_ENV: development
      API_PORT: '3001'
      # Parallel browser journeys share loopback IPs in CI. Keep rate limiting
      # enabled, with enough headroom that this suite is not an accidental load test.
      RATE_LIMIT_MAX: '1000'
      # The journeys sign in for real (M3a), many times a minute from one address.
      LOGIN_RATE_LIMIT_MAX: '1000'
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Deterministic trust layer — no real VeChain dependency in CI.
      DEMO_SIMULATE_ANCHOR: 'true'
      # Guarded scripts (demo:verify, demo:restore, reset:marketplace, ...) fail
      # closed unless --env matches this. See packages/db/scripts/lib/guard.ts.
      TRACE_ENV: local
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3001
      DEMO_PLATFORM_ADMIN_PASSWORD: ci-only-platform-admin-password
      DEMO_HUB_ADMIN_PASSWORD: ci-only-hub-admin-password
      DEMO_HUB_STAFF_PASSWORD: ci-only-hub-staff-password
      DEMO_INSPECTOR_PASSWORD: ci-only-inspector-password
      DEMO_BUYER_PASSWORD: ci-only-buyer-password
      DEMO_SUPPLIER_PASSWORD: ci-only-supplier-password
      DEMO_SUPPLIER2_PASSWORD: ci-only-supplier-two-password
      DEMO_APPLICANT_PASSWORD: ci-only-applicant-password

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate + seed the test database
        run: |
          mkdir -p "$STORAGE_DIR"
          pnpm --filter @trace/db migrate
          pnpm --filter @trace/db seed
          # The curated demo catalogue. Run by no workflow before this, which is
          # why CI could never assert anything about the demo.
          pnpm --filter @trace/db seed:products
          pnpm --filter @trace/db demo:restore -- --env local --yes

      # Fails the PR if the change under review breaks seeding, the personas, or
      # the canonical fingerprint.
      #
      # WHAT THIS DOES NOT CATCH (verified, not assumed): a pure catalogue edit
      # such as renaming a product. CI builds its world from the catalogue on
      # every run, so seeding and verifying move together and a rename is
      # self-consistent here. Deployed environments keep the OLD rows, so the
      # same rename is caught by demo:verify at deploy time with "carries the
      # curated tag but is not in the catalogue". Renaming a curated product is
      # therefore a deliberate act that needs a restore on each environment.
      - name: Demo integrity (before the suite runs)
        run: pnpm --filter @trace/db demo:verify -- --env local

      - name: Build
        run: pnpm build

      - name: Start API + Web
        run: |
          (cd packages/api && exec node_modules/.bin/tsx src/index.ts) > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          (cd packages/web && exec node_modules/.bin/next start) > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health >/dev/null && curl -sf http://localhost:3000 >/dev/null && break || sleep 2
          done

      # WebKit for the sign-in spec (M3a): the session cookie must work in
      # Safari's engine too, which drops Secure cookies on http.
      - name: Install Playwright browsers
        run: pnpm --filter @trace/e2e exec playwright install --with-deps chromium webkit

      # Functional + mobile specs. Visual specs are opt-in (RUN_VISUAL=1) and run
      # in the pinned Playwright container locally, where rendering matches the
      # committed baselines — so they are intentionally skipped here.
      - name: Run E2E suite (functional + mobile, and sign-in on WebKit)
        env:
          E2E_WEBKIT: '1'
        run: pnpm e2e

      # The E2E suite creates its own passports and listings and makes a real
      # offer. If a new test ever does that against a CURATED listing — or edits
      # a curated passport — the demo environment is silently broken and nobody
      # finds out until a prospect is watching. This is the check that catches it.
      - name: The demo must survive the E2E suite
        run: pnpm --filter @trace/db demo:verify -- --env local

      # The live demo runs the public_buyer_demo profile (curated-only browse,
      # a curated lot's last unit kept back), which the run above doesn't (C7).
      # The same suite again on that profile, as the local rehearsal runs it.
      - name: Restart in public buyer demo mode
        run: |
          # The servers were started by an earlier step, so `wait` can't see
          # them: poll until both have exited and freed their ports.
          kill "$(cat /tmp/api.pid)" "$(cat /tmp/web.pid)"
          for i in $(seq 1 30); do
            kill -0 "$(cat /tmp/api.pid)" 2>/dev/null || kill -0 "$(cat /tmp/web.pid)" 2>/dev/null || break
            sleep 1
          done
          (
            cd packages/api
            export TRACE_DEPLOYMENT_PROFILE=public_buyer_demo
            exec node_modules/.bin/tsx src/index.ts
          ) > /tmp/api-demo.log 2>&1 &
          echo $! > /tmp/api.pid
          (
            cd packages/web
            export TRACE_DEPLOYMENT_PROFILE=public_buyer_demo
            exec node_modules/.bin/next start
          ) > /tmp/web-demo.log 2>&1 &
          echo $! > /tmp/web.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health/ready >/dev/null \
              && curl -sf http://localhost:3000 >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo 'the restarted servers did not become ready' >&2; exit 1; }

      - name: Run E2E suite on the public buyer demo profile
        env:
          E2E_CURATED_ONLY: '1'
        run: pnpm e2e

      - name: The demo must survive the suite on its own profile
        run: pnpm --filter @trace/db demo:verify -- --env local

      - name: Restart in public showcase mode
        run: |
          # The servers were started by an earlier step, so `wait` can't see
          # them: poll until both have exited and freed their ports.
          kill "$(cat /tmp/api.pid)" "$(cat /tmp/web.pid)"
          for i in $(seq 1 30); do
            kill -0 "$(cat /tmp/api.pid)" 2>/dev/null || kill -0 "$(cat /tmp/web.pid)" 2>/dev/null || break
            sleep 1
          done
          (
            cd packages/api
            export TRACE_DEPLOYMENT_PROFILE=public_showcase
            exec node_modules/.bin/tsx src/index.ts
          ) > /tmp/api-showcase.log 2>&1 &
          echo $! > /tmp/api.pid
          (
            cd packages/web
            export TRACE_DEPLOYMENT_PROFILE=public_showcase
            exec node_modules/.bin/next start
          ) > /tmp/web-showcase.log 2>&1 &
          echo $! > /tmp/web.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health/ready >/dev/null \
              && curl -sf http://localhost:3000 >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo 'the restarted servers did not become ready' >&2; exit 1; }

      - name: Run public showcase browser journeys
        run: pnpm --filter @trace/e2e e2e:showcase

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "----- API -----"; tail -n 120 /tmp/api.log || true
          echo "----- WEB -----"; tail -n 120 /tmp/web.log || true
          echo "----- DEMO API -----"; tail -n 120 /tmp/api-demo.log || true
          echo "----- DEMO WEB -----"; tail -n 120 /tmp/web-demo.log || true
          echo "----- SHOWCASE API -----"; tail -n 120 /tmp/api-showcase.log || true
          echo "----- SHOWCASE WEB -----"; tail -n 120 /tmp/web-showcase.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7
